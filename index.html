<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V8 Supercars Live Timing</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --panel-bg: #181b22;
            --border-color: #2b303c;
            --text-main: #f0f3f6;
            --text-dim: #8b949e;
            --accent-green: #238636;
            --accent-red: #da3633;
            --accent-gold: #d29922;
            --accent-silver: #c0c0c0;
            --accent-bronze: #cd7f32;
            --pit-badge: #e3b341;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 16px 24px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            font-size: 0.85rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            background: #333;
            color: #aaa;
        }

        .status-live {
            background: var(--accent-green);
            color: #fff;
            box-shadow: 0 0 10px rgba(35, 134, 54, 0.4);
        }

        .status-error {
            background: var(--accent-red);
            color: #fff;
        }

        .table-container {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #12151b;
            color: var(--text-dim);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 16px;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            font-variant-numeric: tabular-nums;
        }

        tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.02);
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .pos-cell {
            font-weight: 800;
            width: 60px;
        }

        .p1 { color: var(--accent-gold); }
        .p2 { color: var(--accent-silver); }
        .p3 { color: var(--accent-bronze); }

        .car-cell {
            width: 70px;
        }

        .car-num {
            font-weight: 700;
            background: #252a35;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            display: inline-block;
            text-align: center;
            min-width: 32px;
        }

        .driver-name {
            font-weight: 600;
        }

        .pit-indicator {
            background-color: var(--pit-badge);
            color: #000;
            font-weight: 800;
            font-size: 0.72rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
        }

        .timing-cell {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>V8 Supercars Live Telemetry</h1>
        <div id="statusBadge" class="status-badge">CONNECTING...</div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>POS</th>
                    <th>#</th>
                    <th>DRIVER</th>
                    <th>LAPS</th>
                    <th>GAP / INT</th>
                    <th>LAST LAP</th>
                    <th>S1</th>
                    <th>S2</th>
                    <th>S3</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody">
                <tr>
                    <td colspan="9" style="text-align: center; color: var(--text-dim); padding: 30px;">
                        Waiting for live telemetry stream...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const TELEMETRY_URL = "https://vigilant-space-cod-jjj576w975963qrvq-8765.app.github.dev/telemetry";
        const statusBadge = document.getElementById("statusBadge");
        const tbody = document.getElementById("leaderboardBody");

        async function fetchTelemetry() {
            try {
                const response = await fetch(TELEMETRY_URL, { cache: "no-store" });
                if (!response.ok) throw new Error("HTTP " + response.status);

                const data = await response.json();

                if (data && Array.isArray(data.leaderboard) && data.leaderboard.length > 0) {
                    renderLeaderboard(data.leaderboard);
                    statusBadge.textContent = "LIVE NATSOFT";
                    statusBadge.className = "status-badge status-live";
                }
            } catch (err) {
                console.warn("Telemetry fetch error:", err);
                statusBadge.textContent = "OFFLINE";
                statusBadge.className = "status-badge status-error";
            }
        }

        function renderLeaderboard(cars) {
            // Sort by actual running position P1 -> P26
            cars.sort((a, b) => (Number(a.pos) || 99) - (Number(b.pos) || 99));

            let html = "";
            cars.forEach(car => {
                const posNum = Number(car.pos) || "-";
                let posClass = "";
                if (posNum === 1) posClass = "p1";
                else if (posNum === 2) posClass = "p2";
                else if (posNum === 3) posClass = "p3";

                html += `
                    <tr>
                        <td class="pos-cell ${posClass}">P${posNum}</td>
                        <td class="car-cell"><span class="car-num">${car.car}</span></td>
                        <td class="driver-name">
                            ${car.name || ('Car #' + car.car)}
                            ${car.in_pit ? '<span class="pit-indicator">PIT</span>' : ''}
                        </td>
                        <td class="timing-cell">${car.laps || '-'}</td>
                        <td class="timing-cell">${car.gap || '-'}</td>
                        <td class="timing-cell">${car.last_lap || '-'}</td>
                        <td class="timing-cell">${car.s1 || '-'}</td>
                        <td class="timing-cell">${car.s2 || '-'}</td>
                        <td class="timing-cell">${car.s3 || '-'}</td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        // Initial poll and recurring 1-second refresh
        fetchTelemetry();
        setInterval(fetchTelemetry, 1000);
    </script>
</body>
</html>
